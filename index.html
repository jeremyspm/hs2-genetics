<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS2 Genetics · Trainer</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Pedigree charts, Punnett squares and karyotypes for HS2 (722.541) Test 3, in her question shapes.">
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
.okey{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:inline-flex;
  align-items:center;justify-content:center;font-size:.72rem;color:var(--muted-fg)}
/* ── home: one screen of row cards, each opening its own screen ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
header{border-top:4px solid var(--tool)}
.idcard{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--tool) 15%,var(--card));border:1px solid color-mix(in srgb,var(--tool) 45%,var(--border))}
.idic{flex:0 0 48px;height:48px;border-radius:12px;background:var(--tool);display:flex;align-items:center;justify-content:center;font-size:1.55rem}
.idtx{min-width:0}
.idtx small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--tool) 62%,var(--fg))}
.idtx b{display:block;font-size:1.45rem;line-height:1.15;margin:2px 0 3px;font-weight:800}
.idtx>span{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.3}
@media(max-width:560px){
  .idcard{padding:9px 12px;gap:10px;margin-bottom:8px}
  .idic{flex-basis:40px;height:40px;border-radius:10px;font-size:1.3rem}
  .idtx b{font-size:1.25rem;margin:1px 0 2px}
  .idtx small,.idtx>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow{padding:6px 12px;margin-bottom:5px}
  .lic{flex-basis:36px;height:36px}
  .lsec{margin:8px 4px 4px}
  .hero{padding-top:9px;padding-bottom:9px}
}
.shead .btn{padding:6px 12px;flex:0 0 auto}
.card .lead{margin:0 0 4px;color:var(--muted-fg);font-size:.9rem;line-height:1.5}
.how{margin:0 0 6px}
.how>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--primary);list-style:none;display:inline-block;padding:2px 0}
.how>summary::-webkit-details-marker{display:none}
.how>summary::before{content:'ⓘ '}
.how[open]{border-left:2px solid var(--border);padding-left:10px;margin:4px 0 10px}
.how p{font-size:.86rem;color:var(--muted-fg);margin:.4rem 0}

/* ── this tool: charts ─────────────────────────────────────────────────────────────── */
/* a chart sits on white in both themes, like her figures; a wide one scrolls inside its box, never the page */
.chartbox{background:#fff;border-radius:10px;padding:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartbox svg{display:block;width:100%;height:auto;margin:0 auto}
.chartbox svg.ped .ps{cursor:default}
.chartbox.tap svg.ped .ps{cursor:pointer}
.chartbox svg.ped .ps:focus{outline:none}
.imgbox{background:#fff;border-radius:10px;padding:6px;text-align:center}
.imgbox img{max-width:100%;height:auto;display:block;margin:0 auto}
figure.fig{margin:0}
figure.fig figcaption{font-size:.76rem;color:var(--muted-fg);margin:5px 2px 0}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
@media(min-width:900px){ .pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start} }
.duo{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.duo>figure{flex:1 1 200px}
.herq{border-left:3px solid var(--warn);padding:2px 0 2px 10px;margin:12px 0}
.herq .hq{font-weight:650;line-height:1.45;margin:4px 0 6px}
.herq .src,.meta{font-size:.74rem;color:var(--muted-fg)}
.hopts{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.hopt{font-size:.88rem;padding:5px 9px;border:1px solid var(--border);border-radius:8px;background:var(--muted)}
.hopt.key{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.hopt.key::after{content:'  ✓ her key';color:var(--ok);font-size:.74rem;font-weight:700}
.eng{font-size:.84rem;margin:6px 0 0;padding:7px 10px;border-radius:8px;background:var(--muted);line-height:1.45}
.eng.good{border-left:3px solid var(--ok)} .eng.bad{border-left:3px solid var(--danger)}
.eng b{font-weight:700}
.tagl{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;
  background:hsl(38 92% 55% / .18);color:var(--warn);margin-right:6px}
.tagl.tool{background:hsl(218 91% 64% / .16);color:var(--primary)}
.blankrow{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.86rem;margin:4px 0}
@media(min-width:1000px){ main.wide{max-width:1240px} }
</style>
</head>
<body>
<header>
  <h1>HS2 Genetics · Trainer</h1>
  <span class="d" id="countdown"></span>
  <button class="btn ghost" id="themeBtn" title="theme">◐</button>
  <button class="btn ghost" id="helpBtn" title="what is this?">?</button>
</header>
<main id="view"></main>
<div class="footbar" id="footbar"></div>
<dialog id="helpDlg"><div id="help"></div><button class="btn wide" id="helpClose">Close</button></dialog>
<script src="engine.js"></script>
<script src="her-charts.js"></script>
<script>
'use strict';
/* ── chrome ─────────────────────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TOOL = { kick: 'Health Science 2 · 722.541', name: 'HS2 Genetics', sub: 'Pedigree charts · Punnett squares · karyotypes', icon: '🌳', hue: '#db2777' };
function paintTool() {
  document.documentElement.style.setProperty('--tool', TOOL.hue);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${TOOL.hue}"/><text x="32" y="45" font-size="38" text-anchor="middle">${TOOL.icon}</text></svg>`;
  let l = document.querySelector('link[rel=icon]');
  if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); }
  l.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
const idCard = () => `<div class="idcard"><span class="idic" aria-hidden="true">${TOOL.icon}</span><span class="idtx"><small>${TOOL.kick}</small><b>${TOOL.name}</b><span>${TOOL.sub}</span></span></div>`;
/* storage: our own prefix on the shared jeremyspm.github.io origin; every access can fail (private mode) */
const PFX = 'hs2gen.';
const LS = k => { try { return JSON.parse(localStorage.getItem(PFX + k)); } catch (e) { return null; } };
const SV = (k, v) => { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} };
/* the theme follows the Test 3 Paper Sim's own setting, both ways */
const THEME_KEY = 'hs2t3.theme';
function readTheme() { try { return JSON.parse(localStorage.getItem(THEME_KEY)) || ''; } catch (e) { return ''; } }
function applyTheme() { const t = readTheme(); if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }
$('#themeBtn').onclick = () => { const to = document.documentElement.dataset.theme === 'light' ? '' : 'light'; try { localStorage.setItem(THEME_KEY, JSON.stringify(to)); } catch (e) {} applyTheme(); };
window.addEventListener('storage', e => { if (e.key === THEME_KEY) applyTheme(); });
applyTheme();
/* Test 3 closes Mon 26 Oct 2026 (his calendar note; her Assessment Overview gives the format) */
const TEST3 = new Date(2026, 9, 26, 23, 59);
function paintCountdown() {
  const d = Math.ceil((TEST3 - new Date()) / 864e5);
  $('#countdown').textContent = d > 1 ? `Test 3 closes Mon 26 Oct · ${d} days` : d >= 0 ? 'Test 3 closes today or tomorrow' : 'Test 3 has closed · the final is Thu 5 Nov';
}

/* ── her charts ─────────────────────────────────────────────────────────────────────── */
const HC = {}; HER.forEach(s => HC[s.id] = GEN.parseChart(s));
/* one entry per figure of hers: A-and-B and the rules figure are two charts in one picture */
const HER_GROUPS = [];
HER.forEach(s => { const g = s.part ? HER_GROUPS.find(x => x.part === s.part) : null; if (g) g.ids.push(s.id); else HER_GROUPS.push({ part: s.part, ids: [s.id] }); });
const herImg = f => f.startsWith('../') ? f : '../hs2-test3/img/' + f;
function herList() {
  const rows = HER_GROUPS.map(g => {
    const s = HER.find(x => x.id === g.ids[0]);
    const qs = g.ids.flatMap(id => HER.find(x => x.id === id).qs);
    const title = g.part === 'ab' ? 'Pedigree A and Pedigree B' : g.part === 'rules' ? 'Her dominant and recessive rules figure' : s.t;
    return `<button class="lrow" data-her="${g.ids[0]}"><span class="lic">🖼️</span><span class="ltx"><b>${esc(title)}</b><small>${qs.length} of her question${qs.length === 1 ? '' : 's'} · ${esc((s.imgs[0] || (s.also || [''])[0]).split('/').pop())}</small></span><span class="lch">›</span></button>`;
  }).join('');
  return `<div class="shead"><button class="btn ghost" data-nav="">‹ Home</button><h2>🖼️ Her charts</h2></div>
    <div class="card"><p class="lead">Every pedigree chart in her Module 3 bank, redrawn from data beside her own figure, with her question and her key word for word.</p>
    <details class="how"><summary>How this works</summary>
    <p>Each chart of hers was written down as data: who is male or female, shaded, deceased, a carrier, and who their parents are. The tool draws it again from that data. Under each one are her own questions, her options and her key, labelled as hers.</p>
    <p>The line under each question is the tool working the answer out from the chart alone, with the same engine that makes every generated question. If it ever disagrees with her key, it says so in red; it is never quietly adjusted to agree.</p>
    <p>For the admin: the charts live in <code>her-charts.js</code>; <code>node tests/run.mjs</code> checks every one of her keys (test 4).</p></details></div>
    ${rows}`;
}
function herView(id) {
  const g = HER_GROUPS.find(x => x.ids.includes(id));
  const specs = g.ids.map(i => HER.find(x => x.id === i));
  const s0 = specs[0];
  // her bank sometimes has the same chart twice (a re-upload, or with her question printed on it): show the first, name the rest
  const all = [...new Set(specs.flatMap(s => s.imgs.concat(s.also || [])))];
  const imgs = all.slice(0, 1), dup = all.slice(1);
  const herFigs = imgs.map(f => `<figure class="fig"><div class="imgbox"><img src="${esc(herImg(f))}" alt="Her figure" loading="lazy"></div><figcaption><span class="tagl">her figure</span>${esc(f.split('/').pop())}${dup.length ? ' · also in her bank as ' + dup.map(d => `<a href="${esc(herImg(d))}" target="_blank" rel="noopener">${esc(d.split('/').pop())}</a>`).join(', ') : ''}</figcaption></figure>`).join('');
  const redraws = specs.map(s => `<figure class="fig"><div class="chartbox">${GEN.svg(HC[s.id], { aria: 'Redrawn: ' + s.t })}</div><figcaption><span class="tagl tool">redrawn</span>from data${s.simplified ? ' · simplified: her cartoon people become squares and circles' : ''}</figcaption></figure>`).join('');
  const qs = specs.flatMap(s => s.qs.map(q => ({ s, q })));
  const qHTML = qs.map(({ s, q }) => {
    const src = q.bank ? `quiz ${q.quiz} · ${q.bank}` : q.src === 'revision-59' ? 'her exam revision deck, slide 59' : q.src === 'revision-79' ? 'her exam revision deck, slide 79' : '';
    let body = '';
    const checks = [];
    if (q.blanks) {
      body = q.blanks.map((b, i) => `<div class="blankrow"><b>Blank ${i + 1}:</b> ${b.opts.map(o => `<span class="hopt${o === b.key ? ' key' : ''}">${esc(o)}</span>`).join(' ')}</div>`).join('');
      q.blanks.forEach((b, i) => checks.push({ c: b.check, key: b.key, opts: b.opts, label: 'Blank ' + (i + 1) }));
    } else if (q.opts) {
      body = `<div class="hopts">${q.opts.map(o => `<span class="hopt${o === q.key ? ' key' : ''}">${esc(o)}</span>`).join('')}</div>`;
      checks.push({ c: q.check, key: q.key, opts: q.opts, label: '' });
    } else if (q.written) {
      body = `<div class="hopts">${q.written.map(t => `<span class="hopt">${esc(t)}</span>`).join('')}</div>`;
      checks.push({ c: q.check, key: q.check.key || null, opts: q.check.opts || [], label: '' });
      if (q.check.bb) checks.push({ c: { t: 'bbShape' }, key: q.check.bb, opts: [], label: 'bb' });
    }
    const eng = checks.map(k => {
      if (k.c.t === 'saq') { const r = GEN.herCheck(HC, s, q, k.c, null, []); const good = r.got === r.want; return engLine(good, `${good ? 'The engine gets her answer on its own' : 'The engine disagrees'}: ${esc(r.got.replace(/\|/g, ' · '))}`); }
      const r = GEN.herCheck(HC, s, q, k.c, k.key, k.opts || []);
      const good = r.got === k.key || (k.c.t === 'fixed');
      const lab = k.label ? `<b>${esc(k.label)}.</b> ` : '';
      if (k.c.t === 'fixed') return engLine(true, `${lab}Her rule, taught as a fact: ${esc(k.c.why)}`);
      return engLine(good, `${lab}${good ? 'The engine reaches her key on its own' : 'The engine does not reach her key'}: <b>${esc(r.got ?? 'no single answer')}</b>${r.why ? ` <span class="meta">(${esc(r.why)})</span>` : ''}`);
    }).join('');
    return `<div class="herq"><div class="src"><span class="tagl">her question</span>${esc(src)}</div><div class="hq">${esc(q.q)}</div>${body}${eng}</div>`;
  }).join('');
  const title = g.part === 'ab' ? 'Pedigree A and Pedigree B' : g.part === 'rules' ? 'Her dominant and recessive rules figure' : s0.t;
  return `<div class="shead"><button class="btn ghost" data-nav="her">‹ Her charts</button><h2>${esc(title)}</h2></div>
    <div class="pair"><div>${herFigs || '<p class="meta">Her figure is a slide in the final exam sim.</p>'}</div><div class="${specs.length > 1 ? 'duo' : ''}">${redraws}</div></div>
    <div class="card">${qHTML || '<p class="meta">Her bank asks no question of this chart on its own (it is one half of a pair).</p>'}</div>`;
}
const engLine = (good, html) => `<div class="eng ${good ? 'good' : 'bad'}">${good ? '✓' : '⚠'} ${html}</div>`;

/* ── home ───────────────────────────────────────────────────────────────────────────── */
function homeView() {
  const n = HER.reduce((a, s) => a + s.qs.length, 0);
  return `${idCard()}
    <div class="lsec">Look at her charts</div>
    <button class="lrow" data-nav="her"><span class="lic">🖼️</span><span class="ltx"><b>Her charts</b><small>${HER_GROUPS.length} figures from her bank, redrawn, with her ${n} questions</small></span><span class="lch">›</span></button>
    <div class="note">Build in progress (P2 of the plan): the drills, the two doors and the Test 3 set come next. This screen shows only what works today.</div>`;
}

/* ── routing ────────────────────────────────────────────────────────────────────────── */
function route() { return decodeURIComponent(location.hash.slice(1)); }
function nav(r) { history.pushState({ r }, '', r ? '#' + r : location.pathname + location.search); render(); window.scrollTo(0, 0); }
window.addEventListener('popstate', () => { render(); window.scrollTo(0, 0); });
function render() {
  const r = route(), [a, b] = r.split('/');
  $('#footbar').classList.remove('on');
  const main = $('#view');
  main.classList.toggle('wide', a === 'her' && !!b);
  if (a === 'her' && b && HER_GROUPS.some(g => g.ids.includes(b))) main.innerHTML = herView(b);
  else if (a === 'her') main.innerHTML = herList();
  else main.innerHTML = homeView();
  document.title = a === 'her' ? 'Her charts · HS2 Genetics' : 'HS2 Genetics · Trainer';
}
document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if (n) { nav(n.dataset.nav); return; }
  const h = e.target.closest('[data-her]'); if (h) { nav('her/' + h.dataset.her); return; }
});
$('#helpBtn').onclick = () => {
  $('#help').innerHTML = `<h2 style="margin-top:0">What is this?</h2>
  <p>A trainer for the genetics charts on HS2 Test 3 (her words, in six quiz stems: <b>PEDIGREE CHARTS WILL BE TESTED IN TEST 3</b>). It makes endless fresh pedigree, Punnett and karyotype questions in exactly the shapes her quizzes use, and re-draws her own charts so every question type can be asked about them.</p>
  <h3>Where the answers come from</h3>
  <p>Every key is worked out by the engine from the chart as drawn, the same way her method does it: does it skip a generation, is there a gender difference, who are the homozygous recessives. Her own questions and keys are shown word for word and labelled as hers.</p>
  <h3>For the admin</h3>
  <p><code>engine.js</code> is all the genetics; <code>her-charts.js</code> is her charts as data; <code>node tests/run.mjs</code> checks the engine against a brute force and against every key she wrote. Progress lives in this browser only, under <code>hs2gen.</code>.</p>`;
  $('#helpDlg').showModal();
};
$('#helpClose').onclick = () => $('#helpDlg').close();
paintTool(); paintCountdown(); render();
</script>

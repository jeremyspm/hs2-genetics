<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS2 Genetics · Trainer</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Pedigree charts, Punnett squares and karyotypes for HS2 (722.541) Test 3, in her question shapes.">
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
.okey{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:inline-flex;
  align-items:center;justify-content:center;font-size:.72rem;color:var(--muted-fg)}
/* ── home: one screen of row cards, each opening its own screen ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
header{border-top:4px solid var(--tool)}
.idcard{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--tool) 15%,var(--card));border:1px solid color-mix(in srgb,var(--tool) 45%,var(--border))}
.idic{flex:0 0 48px;height:48px;border-radius:12px;background:var(--tool);display:flex;align-items:center;justify-content:center;font-size:1.55rem}
.idtx{min-width:0}
.idtx small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--tool) 62%,var(--fg))}
.idtx b{display:block;font-size:1.45rem;line-height:1.15;margin:2px 0 3px;font-weight:800}
.idtx>span{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.3}
@media(max-width:560px){
  .idcard{padding:9px 12px;gap:10px;margin-bottom:8px}
  .idic{flex-basis:40px;height:40px;border-radius:10px;font-size:1.3rem}
  .idtx b{font-size:1.25rem;margin:1px 0 2px}
  .idtx small,.idtx>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow{padding:6px 12px;margin-bottom:5px}
  .lic{flex-basis:36px;height:36px}
  .lsec{margin:8px 4px 4px}
  .hero{padding-top:9px;padding-bottom:9px}
}
.shead .btn{padding:6px 12px;flex:0 0 auto}
.card .lead{margin:0 0 4px;color:var(--muted-fg);font-size:.9rem;line-height:1.5}
.how{margin:0 0 6px}
.how>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--primary);list-style:none;display:inline-block;padding:2px 0}
.how>summary::-webkit-details-marker{display:none}
.how>summary::before{content:'ⓘ '}
.how[open]{border-left:2px solid var(--border);padding-left:10px;margin:4px 0 10px}
.how p{font-size:.86rem;color:var(--muted-fg);margin:.4rem 0}

/* ── this tool: charts ─────────────────────────────────────────────────────────────── */
/* a chart sits on white in both themes, like her figures; a wide one scrolls inside its box, never the page */
.chartbox{background:#fff;border-radius:10px;padding:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartbox svg{display:block;width:100%;height:auto;margin:0 auto}
.chartbox svg.ped .ps{cursor:default}
.chartbox.tap svg.ped .ps{cursor:pointer}
.chartbox svg.ped .ps:focus{outline:none}
.imgbox{background:#fff;border-radius:10px;padding:6px;text-align:center}
.imgbox img{max-width:100%;height:auto;display:block;margin:0 auto}
figure.fig{margin:0}
figure.fig figcaption{font-size:.76rem;color:var(--muted-fg);margin:5px 2px 0}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
@media(min-width:900px){ .pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start} }
.duo{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.duo>figure{flex:1 1 200px}
.herq{border-left:3px solid var(--warn);padding:2px 0 2px 10px;margin:12px 0}
.herq .hq{font-weight:650;line-height:1.45;margin:4px 0 6px}
.herq .src,.meta{font-size:.74rem;color:var(--muted-fg)}
.hopts{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.hopt{font-size:.88rem;padding:5px 9px;border:1px solid var(--border);border-radius:8px;background:var(--muted)}
.hopt.key{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.hopt.key::after{content:'  ✓ her key';color:var(--ok);font-size:.74rem;font-weight:700}
.eng{font-size:.84rem;margin:6px 0 0;padding:7px 10px;border-radius:8px;background:var(--muted);line-height:1.45}
.eng.good{border-left:3px solid var(--ok)} .eng.bad{border-left:3px solid var(--danger)}
.eng b{font-weight:700}
.tagl{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;
  background:hsl(38 92% 55% / .18);color:var(--warn);margin-right:6px}
.tagl.tool{background:hsl(218 91% 64% / .16);color:var(--primary)}
.blankrow{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.86rem;margin:4px 0}
@media(min-width:1000px){ main.wide{max-width:1240px} }
/* ── a sitting: chart left and question right on the handheld, stacked on a phone ── */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media(min-width:1000px){
  main.sit{max-width:1240px}
  .qgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
  .qgrid .qchart{position:sticky;top:70px}
  .opt,.btn{min-height:48px}
}
.qhead{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.qhead .n{font-weight:700}
.qhead .ty{font-size:.78rem;color:var(--muted-fg)}
.stem{font-weight:650;line-height:1.5;margin:2px 0 10px}
.prem{font-size:.8rem;color:var(--warn);font-weight:700;margin:0 0 4px}
.opt{width:100%;font:inherit;color:var(--fg);text-align:left;align-items:center;min-height:44px}
.opt:focus-visible,.btn:focus-visible,.ddb:focus-visible,.ddo:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.fb{border-left:4px solid var(--border);padding:8px 0 4px 12px;margin:12px 0 4px}
.fb.right{border-color:var(--ok)} .fb.wrong{border-color:var(--danger)}
.fb .verdict{font-weight:800;margin:0 0 6px}
.fb.right .verdict{color:var(--ok)} .fb.wrong .verdict{color:var(--danger)}
.fb p{margin:5px 0;font-size:.9rem;line-height:1.5}
.fb .rule{color:var(--muted-fg);font-size:.86rem}
.fb .slip{background:hsl(0 84% 60% / .1);border-radius:8px;padding:6px 9px}
.fb .slip b{color:var(--danger)}
.fb .hkey{font-size:.84rem;color:var(--warn)}
.fbacts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.fbacts .btn{padding:7px 12px;font-size:.84rem;min-height:40px}
.tapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.tapbar .hint{font-size:.82rem;color:var(--muted-fg);flex:1 1 200px}
.evres{font-size:.86rem;margin:6px 0 0;line-height:1.5}
.evres div{margin:3px 0}
/* the justify-it cloze: each blank is a button over an INLINE panel, never a native <select> */
.cloze{line-height:2.3;font-size:1rem}
.ddb{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:.95rem;font-weight:650;color:var(--primary);background:var(--card);
  border:1.5px dashed var(--primary);border-radius:8px;padding:3px 10px;cursor:pointer;min-height:40px;vertical-align:middle;line-height:1.25;text-align:left}
.ddb.set{border-style:solid;color:var(--fg)}
.ddb.open{box-shadow:0 0 0 2px var(--primary)}
.ddb.k{border:1.5px solid var(--ok);color:var(--fg)} .ddb.x{border:1.5px solid var(--danger);color:var(--fg)}
.ddp{display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted)}
.ddo{font:inherit;text-align:left;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;min-height:44px}
.ddfix{font-size:.8rem;color:var(--muted-fg);margin:2px 0 0}
.allres{font-size:.86rem;margin:8px 0 0}
.allres div{margin:4px 0;line-height:1.45}
.duo2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media(max-width:560px){ .duo2{grid-template-columns:minmax(0,1fr)} }
.sq{border-collapse:collapse;margin:8px 0;font-weight:700}
.sq td,.sq th{border:1px solid var(--border);padding:6px 10px;text-align:center;min-width:48px}
.sq th{color:var(--primary);background:var(--muted)}
.chip2{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg);margin:0 4px 4px 0}
.done{text-align:center;padding:20px 10px}
.done .big{font-size:2rem;font-weight:800}
.qbody.solo{max-width:720px;margin:0 auto 12px}
.sqcard{background:var(--card)}
.sqcard.spot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sqcard .sq{margin:4px 0}
.bchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.chipb{font:inherit;font-weight:700;font-size:1.05rem;min-width:52px;min-height:44px;border-radius:10px;border:1px solid var(--primary);background:var(--card);color:var(--fg);cursor:pointer}
.chipb.on{background:var(--primary);color:var(--onprimary)}
.sq.build th,.sq.build td{padding:4px}
.bslot,.bcell{font:inherit;font-weight:700;font-size:1rem;min-width:60px;min-height:48px;border-radius:8px;border:1.5px dashed var(--border);background:var(--card);color:var(--fg);cursor:pointer}
.bslot{border-color:var(--primary);color:var(--primary)}
.bslot.set,.bcell.set{border-style:solid}
.bslot.k,.bcell.k{border:2px solid var(--ok)} .bslot.x,.bcell.x{border:2px solid var(--danger)}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg);font-weight:700}
.qhead .timer.low{color:var(--danger)}
.why{margin:0 0 6px;color:var(--primary)}
.saved{margin:10px 0 0;color:var(--ok)}
.wprompts{margin:4px 0 10px;padding-left:1.4em;font-weight:600;line-height:1.5}
.wmodel{margin:10px 0}
.wpart{display:block;width:100%;text-align:left;font:inherit;font-size:.9rem;line-height:1.5;color:var(--fg);background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;min-height:44px}
.wpart.on{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.wpart.on::before{content:'✓ ';color:var(--ok);font-weight:800}
.herans p{font-size:.88rem;margin:.3rem 0;line-height:1.5;border-left:3px solid var(--warn);padding-left:8px}
.sliprow>span:first-child{flex:1 1 auto;min-width:0}
.sliprow .num{text-align:right;flex:0 0 auto;max-width:48%}
.sliprow .num.ok{color:var(--ok);font-weight:700}
.karyobox svg{display:block;width:100%;height:auto;margin:0 auto}
.askher{margin:0 0 12px}
.toggle{display:flex;gap:10px;align-items:center;font-size:.9rem;margin:4px 4px 10px;cursor:pointer;min-height:44px}
.toggle input{width:20px;height:20px;accent-color:var(--primary)}
.cgrp{margin:12px 0}
.cq{font-weight:650;margin:10px 0 6px;line-height:1.45}
.cchips{display:flex;flex-direction:column;gap:6px}
.cchip{font:inherit;font-size:.9rem;text-align:left;color:var(--fg);background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer;min-height:44px;line-height:1.4}
.cchip.on{border-color:var(--primary);background:var(--accent);box-shadow:inset 0 0 0 1px var(--primary)}
.cchip.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)} .cchip.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.mpart{font-size:.9rem;line-height:1.5;margin:6px 0}
.storyt{font-size:1rem;line-height:1.6;background:var(--muted);border-radius:10px;padding:10px 12px;margin:0 0 10px;border-left:3px solid var(--tool)}
.c4{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:700px){ .c4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.c4b{font:inherit;color:var(--fg);text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;cursor:pointer}
.c4b.k{border:2px solid var(--ok)} .c4b.x{border:2px solid var(--danger)}
.c4why{display:block;font-size:.84rem;margin-top:6px;line-height:1.45}
.sliprow{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;padding:5px 0;border-bottom:1px dashed var(--border)}
</style>
</head>
<body>
<header>
  <h1>HS2 Genetics · Trainer</h1>
  <span class="d" id="countdown"></span>
  <button class="btn ghost" id="themeBtn" title="theme">◐</button>
  <button class="btn ghost" id="helpBtn" title="what is this?">?</button>
</header>
<main id="view"></main>
<div class="footbar" id="footbar"></div>
<dialog id="helpDlg"><div id="help"></div><button class="btn wide" id="helpClose">Close</button></dialog>
<script src="engine.js"></script>
<script src="her-charts.js"></script>
<script>
'use strict';
/* ── chrome ─────────────────────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TOOL = { kick: 'Health Science 2 · 722.541', name: 'HS2 Genetics', sub: 'Pedigree charts · Punnett squares · karyotypes', icon: '🌳', hue: '#db2777' };
function paintTool() {
  document.documentElement.style.setProperty('--tool', TOOL.hue);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${TOOL.hue}"/><text x="32" y="45" font-size="38" text-anchor="middle">${TOOL.icon}</text></svg>`;
  let l = document.querySelector('link[rel=icon]');
  if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); }
  l.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
const idCard = () => `<div class="idcard"><span class="idic" aria-hidden="true">${TOOL.icon}</span><span class="idtx"><small>${TOOL.kick}</small><b>${TOOL.name}</b><span>${TOOL.sub}</span></span></div>`;
/* storage: our own prefix on the shared jeremyspm.github.io origin; every access can fail (private mode) */
const PFX = 'hs2gen.';
const LS = k => { try { return JSON.parse(localStorage.getItem(PFX + k)); } catch (e) { return null; } };
const SV = (k, v) => { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} };
/* the theme follows the Test 3 Paper Sim's own setting, both ways */
const THEME_KEY = 'hs2t3.theme';
function readTheme() { try { return JSON.parse(localStorage.getItem(THEME_KEY)) || ''; } catch (e) { return ''; } }
function applyTheme() { const t = readTheme(); if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }
$('#themeBtn').onclick = () => { const to = document.documentElement.dataset.theme === 'light' ? '' : 'light'; try { localStorage.setItem(THEME_KEY, JSON.stringify(to)); } catch (e) {} applyTheme(); };
window.addEventListener('storage', e => { if (e.key === THEME_KEY) applyTheme(); });
applyTheme();
/* Test 3 closes Mon 26 Oct 2026 (his calendar note; her Assessment Overview gives the format) */

  const main = $('#view');
  main.classList.toggle('wide', a === 'her' && !!b);
  main.classList.toggle('sit', a === 'sit');
  if (a === 'sit' && SIT) { paintSit(); document.title = SIT.title + ' · HS2 Genetics'; return; }
  if (a === 'her' && b && HER_GROUPS.some(g => g.ids.includes(b))) main.innerHTML = herView(b);
  else if (a === 'her') main.innerHTML = herList();
  else if (a === 'ped') main.innerHTML = pedList();
  else if (a === 'pun') main.innerHTML = punList();
  else if (a === 'prog') main.innerHTML = progView();
  else if (a === 'kar') main.innerHTML = karList();
  else if (a === 'write') main.innerHTML = writeList();
  else main.innerHTML = homeView();
  document.title = a === 'her' ? 'Her charts · HS2 Genetics' : a === 'ped' ? 'Pedigree drills · HS2 Genetics' : a === 'pun' ? 'Punnett squares · HS2 Genetics' : a === 'prog' ? 'Slips and readiness · HS2 Genetics' : a === 'kar' ? 'Karyotypes · HS2 Genetics' : a === 'write' ? 'Write it · HS2 Genetics' : 'HS2 Genetics · Trainer';
}
document.addEventListener('click', e => {
  const t = e.target;
  const n = t.closest('[data-nav]'); if (n) { nav(n.dataset.nav); return; }
  const h = t.closest('[data-her]'); if (h) { nav('her/' + h.dataset.her); return; }
  const go = t.closest('[data-go]'); if (go) { if (go.dataset.go === 'decide') startDecide(); else startSet(); return; }
  if (t.closest('#undoLast')) { const l = logGet(); l.pop(); SV('log', l); render(); return; }
  if (t.closest('#resetAll')) { if (confirm('Reset all progress in this browser? Your slips, streaks and history go.')) { SV('log', []); render(); } return; }
  const d = t.closest('[data-drill]'); if (d) { const [ty, md] = d.dataset.drill.split(':'); startSit(ty === 'mixed' ? 'Mixed pedigree round' : ty === 'mixedPun' ? 'Mixed Punnett round' : ty === 'mixedKar' ? 'Mixed karyotypes' : TYPE_LABEL[ty], () => makeQ(ty, md ? { mode: md } : {}), ty === 'story' ? 5 : 10); return; }
  const ah = t.closest('[data-askher]'); if (ah) { startHer(ah.dataset.askher); return; }
  if (t.id === 'drawFirst') { SV('drawFirst', t.checked); return; }
  if (route() !== 'sit' || !SIT) return;
  const it = cur();
  if (t.closest('#leave')) { if (SIT.test && !SIT.fin && !SIT.review && SIT.items.some(x => x.st.done) && !confirm('Stop this set? Nothing is scored.')) return; SIT = null; nav(''); return; }
  if (t.closest('#review')) { SIT.review = true; SIT.fin = false; SIT.i = 0; paintSit(); window.scrollTo(0, 0); return; }
  if (t.closest('#again')) { const wasSet = SIT.test, wasDec = SIT.decide, nx = SIT.next, ti = SIT.title; SIT = null; history.replaceState(null, '', location.pathname); if (wasSet) startSet(); else if (wasDec) startDecide(); else startSit(ti, nx); return; }
  if (t.closest('#nextQ')) { nextQ(); return; }
  if (t.closest('#prevQ')) { if (SIT.i) { SIT.i--; paintSit(); } return; }
  if (!it) return;
  const { q, st } = it;
  const o = t.closest('[data-o]'); if (o) { answer(+o.dataset.o); return; }
  const b = t.closest('[data-b]'); if (b && !st.done) { const i = +b.dataset.b; st.open = st.open === i ? null : i; paintSit(); const p = $('.ddo'); if (p) p.focus(); return; }
  const bo = t.closest('[data-bo]'); if (bo && st.open != null) { st.blanks[st.open] = +bo.dataset.bo; const nx = st.blanks.findIndex(v => v == null); st.open = nx >= 0 ? nx : null; paintSit(); return; }
  if (t.closest('#ckCloze')) {
    st.done = true; const wrong = q.blanks.findIndex((bl, i) => st.blanks[i] !== bl.key);
    st.ok = wrong < 0; st.slip = st.ok ? null : (q.blanks[wrong].opts[st.blanks[wrong]].slip || 'W9'); st.tagged = !st.ok && !!q.blanks[wrong].opts[st.blanks[wrong]].slip; st.open = null;
    record(q, st.ok, st.slip); afterAnswer(it); paintSit(); return;
  }
  if (t.closest('#ckAll')) {
    st.done = true;
    const by = GEN.prep(q.chart).by, sty = { L: q.args.L, x: 'sup' };
    const wrong = q.people.filter(p => !(st.marks[p.id] != null && p.cycle[st.marks[p.id]] === p.key));
    st.ok = !wrong.length;
    const w0 = wrong.find(p => st.marks[p.id] != null);
    const sl0 = w0 && GEN.allSlip(q.mode, by[w0.id], w0.set, w0.cycle[st.marks[w0.id]], sty);
    st.slip = st.ok ? null : sl0 || 'W9'; st.tagged = !!sl0;
    record(q, st.ok, st.slip); afterAnswer(it); paintSit(); return;
  }
  const chip = t.closest('[data-chip]'); if (chip && !st.done) { st.chip = st.chip === chip.dataset.chip ? null : chip.dataset.chip; st.msg = ''; paintSit(); return; }
  const sl = t.closest('[data-slot]'); if (sl && !st.done) {
    const k = sl.dataset.slot[0], i = +sl.dataset.slot[1], arr = k === 't' ? st.top : st.side;
    if (!st.chip) { arr[i] = null; st.msg = 'Pick a gamete first, then tap where it goes.'; paintSit(); return; }
    arr[i] = st.chip;
    const par = k === 't' ? q.args.g1 : q.args.g2, pg = k === 't' ? q.P.top : q.P.side;
    st.msg = pg.includes(st.chip) ? '' : `${par} cannot make a ${st.chip} gamete: a gamete carries ONE allele from that parent (${pg.join(' or ')}).`;
    st.chip = null; paintSit(); return;
  }
  const ce = t.closest('[data-cell]'); if (ce && !st.done) {
    const [i, j] = ce.dataset.cell.split(',').map(Number), opts = q.cellOpts, v = st.cells[i][j];
    st.cells[i][j] = opts[(opts.indexOf(v) + 1) % opts.length];
    const exp = st.top[j] && st.side[i] ? GEN.joinG(q.fam, st.top[j], st.side[i]) : null;
    st.msg = exp && st.cells[i][j] !== exp ? 'Each box takes ONE letter from the top and ONE from the side.' : '';
    paintSit(); return;
  }
  if (t.closest('#ckBuild')) {
    const g = bOK(q, st);
    const cellsOK = st.cells.every((r, i) => r.every((v, j) => v === GEN.joinG(q.fam, st.top[j], st.side[i])));
    st.done = true; st.ok = g.gam && cellsOK; st.slip = st.ok ? null : 'W7'; st.tagged = false;
    st.msg = st.ok ? '' : !g.gam ? 'A gamete is wrong: each parent gives ONE allele per gamete, so Bb makes B and b.' : 'A box is wrong: each box takes ONE letter from the top and ONE from the side.';
    record(q, st.ok, st.slip); afterAnswer(it); paintSit(); return;
  }
  const cg = t.closest('[data-cg]'); if (cg && !st.done) { st.pk = st.pk || {}; const g = q.groups.find(x => x.id === cg.dataset.cg), j = +cg.dataset.cj;
    if (g.multi) { const a = st.pk[g.id] || (st.pk[g.id] = []); const i = a.indexOf(j); if (i >= 0) a.splice(i, 1); else a.push(j); } else st.pk[g.id] = j;
    paintSit(); return; }
  if (t.closest('#ckChips')) { checkChips(it); record(q, st.ok, st.slip); afterAnswer(it); paintSit(); return; }
  if (t.closest('#drawn')) { st.step = 'drawCheck'; paintSit(); return; }
  const dt = t.closest('[data-dt]'); if (dt) { st.dticks[+dt.dataset.dt] = !st.dticks[+dt.dataset.dt]; paintSit(); return; }
  if (t.closest('#drawDone')) { st.step = 2; paintSit(); window.scrollTo(0, 0); return; }
  const c4 = t.closest('[data-c4]'); if (c4 && st.c4 == null) { st.c4 = +c4.dataset.c4; paintSit(); return; }
  if (t.closest('#ckTap')) { st.tapDone = true; st.tapOk = st.taps.length === q.tapKey.length && q.tapKey.every(x => st.taps.includes(x)); paintSit(); return; }
  if (t.closest('#storyNext')) { st.step = st.step === 1 ? 2 : 3; paintSit(); window.scrollTo(0, 0); return; }
  const s3 = t.closest('[data-s3]'); if (s3) { const [qi, oi] = s3.dataset.s3.split(':').map(Number); if (st.sq3[qi] == null) { st.sq3[qi] = oi; if (st.sq3.every(v => v != null)) storyFinish(it); paintSit(); } return; }
  if (t.closest('#reveal')) { st.rev = true; st.ticks = [false, false, false, false]; paintSit(); return; }
  const tk = t.closest('[data-tick]'); if (tk && st.rev && !st.done) { st.ticks[+tk.dataset.tick] = !st.ticks[+tk.dataset.tick]; paintSit(); return; }
  if (t.closest('#markDone')) { st.done = true; st.ok = st.ticks.every(Boolean); st.slip = null; st.tagged = false; record(q, st.ok, null); paintSit(); return; }
  if (t.closest('#evStart')) { st.ev = 'on'; st.taps = []; paintSit(); return; }
  if (t.closest('#evCheck')) { checkEvidence(it, false); paintSit(); return; }
  if (t.closest('#evSkip')) { checkEvidence(it, true); st.evRes.forEach(r => r.ok = false); paintSit(); return; }
  if (t.closest('#sqShow')) { st.sq = true; paintSit(); return; }
  const cp = t.closest('#copyQ'); if (cp) { copyOut(copyText(it), cp); return; }
  const ps = t.closest('#cbox .ps'); if (ps) { tapPerson(ps.dataset.p); return; }
});
$('#helpBtn').onclick = () => {
  $('#help').innerHTML = `<h2 style="margin-top:0">What is this?</h2>
  <p>A trainer for the genetics charts on HS2 Test 3 (her words, in six quiz stems: <b>PEDIGREE CHARTS WILL BE TESTED IN TEST 3</b>). It makes endless fresh pedigree questions in exactly the shapes her quizzes use, and re-draws her own charts so you can check them against hers. Test 3 closes Mon 26 Oct: confirm your own date on Canvas.</p>
  <h3>The two doors</h3>
  <p><b>🧭 Decide for me</b> deals 10 at a time: about 6 aimed at the slip you miss most (over your last 100 answers), 3 from the parts of her list you have seen least, and 1 review of a shape you missed before. A miss comes back 3 questions later, once. With no misses yet it says so and deals evenly, weighted towards pedigrees. <b>Practise</b> is the other door: pick any drill yourself.</p>
  <h3>The Test 3 genetics set</h3>
  <p>12 items in her shapes and her option wordings (one of them a karyotype), on her clock (65 min for 37 questions is about 1 min 45 s each, so 21 min), with one written question last. No feedback until the end; then the score is split by slip and you can review every answer with its feedback.</p>
  <h3>Write it · from a story</h3>
  <p>30% of Test 3 is written. <b>Build it from phrases</b> answers her four pedigree questions by tapping her-worded phrases; <b>Write it on paper</b> reveals this tool's answer for the chart and her own model answer word for word, then you tick what you got. <b>From a story</b> is the final exam's case 14 and 15 shape: pick the chart that matches a family told in words, tap everyone who must be a carrier, then answer the pass-it-on questions (or draw it on paper first).</p>
  <h3>Karyotypes</h3>
  <p>A karyogram drawn from data (22 autosome pairs at their real relative lengths, plus the sex pair) in her seven shapes: normal male or female, trisomy 21, 18 or 13, 45,X and 47,XXY. The pair that gives it away is ringed after you answer.</p>
  <h3>Her charts: ask me every kind of question</h3>
  <p>On any of her charts, 🎲 asks every question shape the engine can key on that chart: counts, relations, the mode, genotypes, the next child, genotype everyone. Where her chart only fits one mode but is too thin to name it from the chart, the question says which mode it takes.</p>
  <h3>Slips and readiness</h3>
  <p>One row per part of her Genetics list. A row is mastered after 3 right in a row, with no hints, across at least 2 days. Undo takes back your last answer; reset clears everything.</p>
  <h3>Where the answers come from</h3>
  <p>Every key is worked out by the engine from the chart as drawn, the way her method does it: does it skip a generation, is there a gender difference, who are the homozygous recessives. Her own questions and keys are shown word for word and labelled as hers. On one of her charts her key assumes a mode the chart alone doesn't force; the page says so there.</p>
  <h3>The slips (W1 to W9)</h3>
  <p>Every wrong option is what a named mistake would give: W1 hidden carrier, W2 autosomal vs X-linked, W3 working backwards, W4 over-calling X-linked, W5 dominant-disorder genotypes, W6 probability wording, W7 genotype vs phenotype, W8 forced vs unknown, W9 chart reading. A wrong pick names its slip and gives the one-line fix.</p>
  <h3>Copy for Claude</h3>
  <p>After any answer, 📋 copies the question, your answer, the key, the slip and the chart written out in words, ready to paste to Claude.</p>
  <h3>For the admin</h3>
  <p><code>engine.js</code> is all the genetics; <code>her-charts.js</code> is her charts as data; <code>node tests/run.mjs</code> checks the engine against a brute force and against every key she wrote. Progress lives in this browser only, under <code>hs2gen.</code>; the theme follows the Test 3 Paper Sim's.</p>`;
  $('#helpDlg').showModal();
};
$('#helpClose').onclick = () => $('#helpDlg').close();
paintTool(); paintCountdown();
if (route() === 'sit' && !SIT) history.replaceState(null, '', location.pathname);
render();
</script>
